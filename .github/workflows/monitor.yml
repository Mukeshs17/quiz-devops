name: Monitor

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  health-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Execute Health and Metrics Check
        env:
          RENDER_APP_URL: ${{ secrets.RENDER_APP_URL }}
        run: |
          chmod +x scripts/check_health.sh
          ./scripts/check_health.sh "${{ secrets.RENDER_APP_URL }}"
