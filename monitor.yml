name: Monitor

# Free monitoring: every 5 minutes GitHub calls the live app.
# If the app is down or has many errors, this run turns RED and GitHub emails you.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Health and error check
        shell: bash
        env:
          APP_URL: ${{ secrets.RENDER_APP_URL }}
        run: |
          if [ -z "$APP_URL" ]; then echo "RENDER_APP_URL secret not set yet - skipping."; exit 0; fi
          bash scripts/check_health.sh "$APP_URL" | tee -a "$GITHUB_STEP_SUMMARY"
