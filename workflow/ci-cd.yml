name: CI-CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  packages: write          # lets the pipeline store the image in GitHub Container Registry (free)

jobs:
  # ---------- CI : check the code ----------
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  # ---------- CD part 1 : build the image and store it ----------
  build-and-push:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Work out the image name (must be lower case)
        id: meta
        run: |
          OWNER=$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          echo "image=ghcr.io/$OWNER/quiz-app" >> "$GITHUB_OUTPUT"

      - name: Login to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build container image
        run: |
          IMAGE=${{ steps.meta.outputs.image }}
          docker build \
            --build-arg APP_VERSION=${GITHUB_SHA::7} \
            --label org.opencontainers.image.source=https://github.com/${{ github.repository }} \
            -t $IMAGE:${{ github.sha }} -t $IMAGE:latest .

      - name: Push image to the registry
        run: |
          IMAGE=${{ steps.meta.outputs.image }}
          docker push $IMAGE:${{ github.sha }}
          docker push $IMAGE:latest

  # ---------- CD part 2 : tell Render to run the new image ----------
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Trigger deploy on Render
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          IMAGE: ${{ needs.build-and-push.outputs.image }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "RENDER_DEPLOY_HOOK_URL secret is not set yet - skipping deploy (first run is normal)."
            exit 0
          fi
          ENC=$(python3 -c "import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1], safe=''))" "$IMAGE:$GITHUB_SHA")
          curl -fsS -X POST "$HOOK&imgURL=$ENC"
          echo "Deploy requested for $IMAGE:$GITHUB_SHA"

      - name: Wait until the new version answers on the live URL
        env:
          APP_URL: ${{ secrets.RENDER_APP_URL }}
        run: |
          if [ -z "$APP_URL" ]; then echo "RENDER_APP_URL secret not set - skipping check."; exit 0; fi
          SHA7=${GITHUB_SHA::7}
          for i in $(seq 1 40); do
            R=$(curl -s --max-time 30 "$APP_URL/healthz" || true)
            echo "try $i: $R"
            echo "$R" | grep -q "$SHA7" && { echo "New version $SHA7 is live."; exit 0; }
            sleep 15
          done
          echo "New version did not appear in 10 minutes."; exit 1
